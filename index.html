<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<title>Конструктор промптов для учителя-методиста</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: 'Segoe UI', Tahoma, sans-serif;
    background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
    min-height: 100vh;
    padding: 20px;
    color: #333;
  }
  .container {
    max-width: 900px;
    margin: 0 auto;
    background: #fff;
    border-radius: 16px;
    padding: 30px;
    box-shadow: 0 20px 60px rgba(0,0,0,0.3);
  }
  h1 {
    color: #4a3f8c;
    margin-bottom: 8px;
    font-size: 26px;
  }
  .subtitle {
    color: #777;
    margin-bottom: 25px;
    font-size: 14px;
  }
  .field {
    margin-bottom: 20px;
  }
  label {
    display: block;
    font-weight: 600;
    margin-bottom: 8px;
    color: #4a3f8c;
  }
  select, input[type="text"], textarea {
    width: 100%;
    padding: 10px 12px;
    border: 2px solid #e0e0e0;
    border-radius: 8px;
    font-size: 15px;
    font-family: inherit;
    transition: border-color 0.2s;
  }
  select:focus, input:focus, textarea:focus {
    outline: none;
    border-color: #667eea;
  }
  textarea { resize: vertical; min-height: 90px; }
  .checkbox-group {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
    gap: 8px;
    margin-top: 6px;
  }
  .checkbox-group label {
    display: flex;
    align-items: flex-start;
    font-weight: 400;
    color: #444;
    cursor: pointer;
    padding: 8px 10px;
    background: #f7f7fb;
    border-radius: 6px;
    border: 2px solid transparent;
    transition: all 0.2s;
    margin: 0;
    font-size: 14px;
  }
  .checkbox-group label:hover { background: #eeeefc; }
  .checkbox-group label.checked {
    background: #e8e6fc;
    border-color: #667eea;
    color: #4a3f8c;
    font-weight: 600;
  }
  .checkbox-group input { margin-right: 8px; margin-top: 2px; }
  .hint { font-size: 12px; color: #888; margin-top: 4px; }
  .btn {
    display: inline-block;
    padding: 12px 28px;
    background: linear-gradient(135deg, #667eea, #764ba2);
    color: #fff;
    border: none;
    border-radius: 8px;
    font-size: 16px;
    font-weight: 600;
    cursor: pointer;
    transition: transform 0.1s;
  }
  .btn:hover { transform: translateY(-2px); }
  .btn-secondary {
    background: #f0f0f0;
    color: #444;
    margin-left: 8px;
  }
  .output {
    margin-top: 25px;
    padding: 18px;
    background: #f9f9fc;
    border-left: 4px solid #667eea;
    border-radius: 8px;
    white-space: pre-wrap;
    font-family: 'Consolas', monospace;
    font-size: 14px;
    line-height: 1.6;
    display: none;
  }
  .output.show { display: block; }
  .counter {
    display: inline-block;
    margin-left: 10px;
    padding: 2px 10px;
    background: #667eea;
    color: #fff;
    border-radius: 12px;
    font-size: 12px;
    font-weight: 600;
  }
</style>
</head>
<body>
<div class="container">
  <h1>🎓 Конструктор промптов</h1>
  <p class="subtitle">Универсальный шаблон для учителя-методиста (адаптация текстов для средней школы)</p>

  <!-- 1. Роль -->
  <div class="field">
    <label>1. Роль</label>
    <select id="role">
      <option value="учитель-методист">Учитель-методист</option>
      <option value="учитель-логопед">Учитель-логопед</option>
      <option value="педагог-психолог">Педагог-психолог</option>
      <option value="тьютор">Тьютор</option>
    </select>
  </div>

  <!-- 2. Исходный текст -->
  <div class="field">
    <label>2. Исходный текст</label>
    <textarea id="sourceText" placeholder="Вставьте текст, который нужно адаптировать..."></textarea>
  </div>

  <!-- 3. Особенность ученика -->
  <div class="field">
    <label>3. Особенность ученика</label>
    <select id="studentType">
      <option value="базовым уровнем подготовки">Базовый уровень</option>
      <option value="задержкой психического развития (ЗПР)">С задержкой психического развития (ЗПР)</option>
      <option value="лёгкой степенью интеллектуальных нарушений">С интеллектуальными нарушениями (лёгкая степень)</option>
      <option value="высокой мотивацией и признаками одарённости">Одарённый / высокомотивированный</option>
      <option value="дислексией или трудностями чтения">Дислексия / трудности чтения</option>
      <option value="неродным русским языком (уровень А2)">Неродной русский (уровень А2)</option>
      <option value="СДВГ или низкой концентрацией внимания">Гиперактивный / низкая концентрация внимания</option>
    </select>
  </div>

  <!-- 4. Возраст / класс -->
  <div class="field">
    <label>4. Возраст / класс</label>
    <input type="text" id="ageClass" placeholder="Например: 3 класс, 7 класс, 10 класс">
  </div>

  <!-- 5. Что важно учителю (БЕЗ ОГРАНИЧЕНИЙ) -->
  <div class="field">
    <label>5. Что важно учителю <span class="hint">(можно выбрать любое количество)</span>
      <span class="counter" id="counter">0 выбрано</span>
    </label>
    <div class="checkbox-group" id="tasksGroup">
      <label><input type="checkbox" value="сделать текст короче (убрать второстепенное)"> Сделать текст короче (убрать второстепенное)</label>
      <label><input type="checkbox" value="разбить на очень короткие фразы"> Разбить на очень короткие фразы</label>
      <label><input type="checkbox" value="добавить примеры из жизни"> Добавить примеры из жизни</label>
      <label><input type="checkbox" value="оставить термины, но объяснить их сразу"> Оставить термины, но объяснить сразу</label>
      <label><input type="checkbox" value="убрать все сравнения и метафоры"> Убрать все сравнения и метафоры</label>
      <label><input type="checkbox" value="добавить вопросы между абзацами"> Добавить вопросы между абзацами</label>
      <label><input type="checkbox" value="сделать текст более ярким / парадоксальным"> Сделать текст ярким / парадоксальным (для одарённых)</label>
    </div>
  </div>

  <!-- 6. Формат выдачи -->
  <div class="field">
    <label>6. Формат выдачи</label>
    <select id="format">
      <option value="сплошным абзацем">Сплошным абзацем</option>
      <option value="по абзацам, как в оригинале">По абзацам, как в оригинале</option>
    </select>
  </div>

  <button class="btn" onclick="generatePrompt()">✨ Сгенерировать промпт</button>
  <button class="btn btn-secondary" onclick="copyPrompt()">📋 Копировать</button>

  <div class="output" id="output"></div>
</div>

<script>
  // Подсветка выбранных чекбоксов + счётчик (без ограничения)
  const checkboxes = document.querySelectorAll('#tasksGroup input[type="checkbox"]');
  const counter = document.getElementById('counter');

  function updateCounter() {
    const count = [...checkboxes].filter(c => c.checked).length;
    counter.textContent = count + ' выбрано';
    counter.style.background = count > 0 ? '#667eea' : '#bbb';
  }

  checkboxes.forEach(cb => {
    cb.addEventListener('change', () => {
      cb.parentElement.classList.toggle('checked', cb.checked);
      updateCounter();
    });
  });

  function generatePrompt() {
    const role = document.getElementById('role').value;
    const text = document.getElementById('sourceText').value.trim();
    const student = document.getElementById('studentType').value;
    const age = document.getElementById('ageClass').value.trim() || 'не указан';
    const tasks = [...checkboxes].filter(c => c.checked).map(c => c.value);
    const format = document.getElementById('format').value;

    if (!text) {
      alert('Пожалуйста, введите исходный текст.');
      return;
    }

    let tasksLine = '';
    if (tasks.length > 0) {
      tasksLine = '\nВажно: ' + tasks.join(', ') + '.';
    }

    // Теперь грамматика безупречна: "для ученика с базовым уровнем подготовки", "для ученика с дислексией" и т.д.
    const prompt =
`Ты — ${role}. Адаптируй текст ниже для ученика с ${student}, ${age}.${tasksLine}
Выдай адаптированный текст ${format}. В самом конце напиши одну короткую рекомендацию для учителя: «На что обратить внимание при работе с этим вариантом».

[Текст: «${text}»]`;

    const out = document.getElementById('output');
    out.textContent = prompt;
    out.classList.add('show');
  }

  function copyPrompt() {
    const out = document.getElementById('output');
    if (!out.classList.contains('show')) {
      alert('Сначала сгенерируйте промпт.');
      return;
    }
    navigator.clipboard.writeText(out.textContent).then(() => {
      alert('✅ Промпт скопирован в буфер обмена!');
    });
  }
</script>
</body>
</html>
